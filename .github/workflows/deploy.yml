name: Deploy price dashboard

# The weekly price routine commits straight to master, so master is the only
# thing that ever needs deploying. It used to push to a claude/* branch, which
# meant this workflow deployed from whichever branch fired it and then synced
# the CSV back to master afterwards -- and the github-pages environment
# rejects deployments from anything but the default branch.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Full history: the footer stamp is the CSV's own last commit date, not
      # the date of this run.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Assemble site
        run: |
          mkdir _site
          cp index.html food_price_comparison.csv food_price_comparison_prev.csv _site/
          stamp=$(git log -1 --format=%cd --date=format:'%-d %B %Y' -- food_price_comparison.csv)
          sed -i "s/__UPDATED__/$stamp/" _site/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
