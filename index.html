<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<title>Where's it cheapest?</title>
<style>
  :root {
    --bg: #f7f4ed;
    --surface: #fffdf8;
    --surface-2: #f0ece2;
    --line: #e3dccc;
    --line-soft: #ede7da;
    --ink: #23201a;
    --ink-dim: #78715f;
    --win-bg: #e8f3e5;
    --win-ink: #1d5a20;
    --win-line: #c2e0bd;
    --accent: #2e6b31;
    --shadow: 0 1px 1px rgba(35,32,26,.04), 0 2px 8px rgba(35,32,26,.045);
    --r: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --surface: #1b1e23;
      --surface-2: #23272f;
      --line: #2e343d;
      --line-soft: #262b33;
      --ink: #e9e6e0;
      --ink-dim: #949aa4;
      --win-bg: #1a3220;
      --win-ink: #93e097;
      --win-line: #2c5233;
      --accent: #8fdd93;
      --shadow: 0 1px 1px rgba(0,0,0,.25), 0 2px 8px rgba(0,0,0,.22);
    }
  }

  /* Retailer brand colours, pulled towards the text contrast each theme needs
     -- Morrisons yellow and Co-op cyan are unreadable at their true values. */
  :root {
    --s-ocado: #6d2c8f;
    --s-sainsburys: #bd5a15;
    --s-tesco: #00539f;
    --s-asda: #5c8a0f;
    --s-morrisons: #8a6100;
    --s-waitrose: #3b7d2e;
    --s-aldi: #14428e;
    --s-lidl: #c00e2c;
    --s-iceland: #8f2030;
    --s-coop: #00799f;
    --s-ms: #2b4a3d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --s-ocado: #c79be0;
      --s-sainsburys: #f0a45f;
      --s-tesco: #78b6ef;
      --s-asda: #aad24d;
      --s-morrisons: #e2b64f;
      --s-waitrose: #8fcb6e;
      --s-aldi: #8fb2ec;
      --s-lidl: #f18b95;
      --s-iceland: #e59aa2;
      --s-coop: #5fc8e8;
      --s-ms: #8cc4ae;
    }
  }
  [data-store="ocado"]      { --b: var(--s-ocado); }
  [data-store="sainsburys"] { --b: var(--s-sainsburys); }
  [data-store="tesco"]      { --b: var(--s-tesco); }
  [data-store="asda"]       { --b: var(--s-asda); }
  [data-store="morrisons"]  { --b: var(--s-morrisons); }
  [data-store="waitrose"]   { --b: var(--s-waitrose); }
  [data-store="aldi"]       { --b: var(--s-aldi); }
  [data-store="lidl"]       { --b: var(--s-lidl); }
  [data-store="iceland"]    { --b: var(--s-iceland); }
  [data-store="coop"]       { --b: var(--s-coop); }
  [data-store="ms"]         { --b: var(--s-ms); }

  /* Week-on-week movement. Green is a price that fell and red one that rose --
     the direction the shopper feels, not the sign of the number. */
  :root {
    --up-ink: #b02a1f;  --up-bg: #fbeae7;  --up-line: #f0cec8;
    --down-ink: #1d5a20; --down-bg: #e8f3e5; --down-line: #c2e0bd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --up-ink: #f3a09a;  --up-bg: #33201e;  --up-line: #55302c;
      --down-ink: #93e097; --down-bg: #1a3220; --down-line: #2c5233;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .price, .chip .n { font-variant-numeric: tabular-nums; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 18px 40px; }

  header {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px;
    margin-bottom: 12px;
  }
  h1 {
    margin: 0;
    font-size: 1.5rem;
    letter-spacing: -0.021em;
    font-weight: 640;
  }
  .updated { margin: 0; color: var(--ink-dim); font-size: .84rem; }

  /* Search */
  .search { position: relative; margin-bottom: 8px; }
  .search svg {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    width: 17px; height: 17px; stroke: var(--ink-dim); fill: none; stroke-width: 2;
    pointer-events: none;
  }
  #q {
    width: 100%;
    height: 42px;
    padding: 0 40px 0 38px;
    font: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    outline: none;
  }
  #q::-webkit-search-cancel-button { display: none; }
  #q::placeholder { color: var(--ink-dim); }
  #q:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  #clear {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 34px; height: 34px; border: 0; border-radius: 50%;
    background: transparent; color: var(--ink-dim);
    font-size: 1.25rem; line-height: 1; cursor: pointer;
    display: none;
  }
  #clear.on { display: block; }
  #clear:hover { color: var(--ink); }

  /* Store filter chips */
  .chips {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 14px;
  }
  .chip {
    height: 30px;
    padding: 0 11px;
    font: inherit; font-size: .84rem;
    color: var(--ink-dim);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip:hover { color: var(--ink); border-color: var(--ink-dim); }
  .chip[data-store]::before {
    content: ""; display: inline-block;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--b); margin-right: 7px; vertical-align: 1px;
  }
  .chip .n { margin-left: 5px; opacity: .65; }
  .chip[aria-pressed="true"] {
    background: var(--win-bg);
    border-color: var(--win-line);
    color: var(--win-ink);
    font-weight: 600;
  }

  /* Cards */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));
    gap: 10px;
  }
  .card {
    position: relative;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
    box-shadow: var(--shadow);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card > * { position: relative; z-index: 1; }

  /* The item's glyph a second time, oversized and blurred into the corner.
     Something to recognise a card by at a glance -- deliberately too faint to
     read, so it never competes with the prices sitting on top of it. */
  .card::before {
    content: var(--ico, "");
    position: absolute; z-index: 0;
    top: -20px; right: -12px;
    font-size: 92px; line-height: 1;
    opacity: .07;
    filter: blur(2px);
    pointer-events: none;
  }
  @media (prefers-color-scheme: dark) {
    .card::before { opacity: .08; }
  }

  .head { display: flex; align-items: center; gap: 10px; }
  .ico {
    flex: none;
    width: 34px; height: 34px;
    display: grid; place-items: center;
    font-size: 1.15rem; line-height: 1;
    background: var(--surface-2);
    border: 1px solid var(--line-soft);
    border-radius: 9px;
  }
  .item {
    margin: 0;
    font-size: .95rem;
    font-weight: 600;
    letter-spacing: -0.008em;
    line-height: 1.3;
  }

  /* One winner per row, full width. Fitting ties side by side left the longer
     store names wrapping inside their box at some card widths. */
  .winners { display: grid; gap: 6px; }
  .win {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--win-bg);
    border: 1px solid var(--win-line);
    border-radius: 9px;
    padding: 8px 10px;
    color: var(--win-ink);
  }
  .win .store {
    color: var(--b, inherit);
    font-size: .84rem; font-weight: 600; line-height: 1.15;
  }
  .win .price { font-size: 1.2rem; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
  .win .unit { font-size: .72rem; font-weight: 500; opacity: .65; }
  .win .store, .win .price { white-space: nowrap; }

  .rest {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
    gap: 2px 14px;
    margin: 0;
    padding-top: 8px;
    border-top: 1px solid var(--line-soft);
    color: var(--ink-dim);
    font-size: .82rem;
  }
  .rest div { display: flex; justify-content: space-between; gap: 8px; white-space: nowrap; }
  .rest .store { color: color-mix(in srgb, var(--b, currentColor) 72%, var(--ink-dim)); }
  .only {
    margin: 0; padding-top: 8px;
    border-top: 1px solid var(--line-soft);
    color: var(--ink-dim); font-size: .82rem;
  }

  .empty { padding: 40px 8px; text-align: center; color: var(--ink-dim); }
  .error {
    padding: 14px; border-radius: var(--r);
    background: var(--surface); border: 1px solid var(--line);
    color: var(--ink); font-size: .9rem;
  }
  .error code { font-size: .82rem; color: var(--ink-dim); word-break: break-word; }

  /* Weekly digest */
  .digest {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
    box-shadow: var(--shadow);
    padding: 14px;
    margin-bottom: 14px;
  }
  .digest h2 {
    margin: 0;
    font-size: 1rem; font-weight: 640; letter-spacing: -0.012em;
  }
  .basket {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px;
    margin: 6px 0 12px;
    color: var(--ink-dim); font-size: .84rem;
  }
  .basket .total { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .basket .tally { margin-left: auto; }
  .movers {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(304px, 1fr));
    gap: 8px;
  }
  .mover {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 11px;
    border: 1px solid; border-radius: 10px;
  }
  .mover.up   { background: var(--up-bg);   border-color: var(--up-line); }
  .mover.down { background: var(--down-bg); border-color: var(--down-line); }
  .mover .mv-ico { flex: none; font-size: 1.35rem; line-height: 1; }
  .mover .mv-text { min-width: 0; flex: 1; }
  .mover .mv-name {
    display: block;
    font-size: .86rem; font-weight: 600; line-height: 1.25;
  }
  .mover .mv-sub {
    display: block;
    margin-top: 1px;
    color: var(--ink-dim); font-size: .74rem;
    font-variant-numeric: tabular-nums;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .mover .mv-pct {
    flex: none;
    font-size: .92rem; font-weight: 700; letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .mover.up   .mv-pct { color: var(--up-ink); }
  .mover.down .mv-pct { color: var(--down-ink); }
  .quiet { margin: 0; color: var(--ink-dim); font-size: .84rem; }
  .fresh { margin: 10px 0 0; color: var(--ink-dim); font-size: .78rem; }

  /* The same figure beside every price on the cards below. */
  .delta {
    font-size: .72rem; font-weight: 600;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .delta.up   { color: var(--up-ink); }
  .delta.down { color: var(--down-ink); }
  .win-fig, .rest-fig { display: flex; align-items: baseline; gap: 7px; }
  .win .delta { font-size: .76rem; }

  @media (hover: hover) {
    .card { transition: border-color .15s ease; }
    .card:hover { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
  }
  @media (max-width: 560px) {
    .wrap { padding: 16px 12px 32px; }
    h1 { font-size: 1.3rem; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Where's it cheapest?</h1>
    <p class="updated">Prices updated <span id="updated">__UPDATED__</span></p>
  </header>

  <section class="digest" id="digest" hidden></section>

  <div class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search an item…" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
    <button id="clear" type="button" aria-label="Clear search">&times;</button>
  </div>

  <div class="chips" id="chips"></div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Nothing matches that.</div>
</div>

<script>
const STORES = ["Ocado","Sainsbury's","Tesco","ASDA","Morrisons","Waitrose","Aldi","Lidl","Iceland","Co-op","M&S"];

const grid = document.getElementById('grid');
const digestEl = document.getElementById('digest');
const emptyEl = document.getElementById('empty');
const chipsEl = document.getElementById('chips');
const q = document.getElementById('q');
const clearBtn = document.getElementById('clear');

let items = [];
let store = null;

function parseLine(line) {
  const out = [];
  let cur = '', quoted = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (quoted) {
      if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; }
      else if (c === '"') quoted = false;
      else cur += c;
    } else if (c === '"') quoted = true;
    else if (c === ',') { out.push(cur.trim()); cur = ''; }
    else cur += c;
  }
  out.push(cur.trim());
  return out;
}

function parseCsv(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
  const head = parseLine(lines[0]);
  const cols = {};
  head.forEach((h, i) => { cols[h] = i; });

  return lines.slice(1).map(line => {
    const f = parseLine(line);
    const prices = [];
    for (const s of STORES) {
      const i = cols[s];
      if (i === undefined) continue;
      const v = parseFloat(f[i]);
      if (Number.isFinite(v)) prices.push({ store: s, price: v });
    }
    prices.sort((a, b) => a.price - b.price);
    const best = prices.length ? prices[0].price : null;
    return {
      name: f[cols['Item']],
      unit: cols['Unit'] === undefined ? '' : f[cols['Unit']],
      prices,
      best,
      byStore: Object.fromEntries(prices.map(p => [p.store, p.price])),
      winners: prices.filter(p => p.price === best),
      others: prices.filter(p => p.price !== best)
    };
  }).filter(it => it.name && it.prices.length);
}

// One glyph per item, matched on the name so a new row in the CSV gets its own
// without touching this file. First match wins, so the narrower word goes
// first -- skyr before yoghurt, lentils before beans.
const ICONS = [
  [/skyr/,            '🫙'],
  [/yogh?urt/,        '🥣'],
  [/milk/,            '🥛'],
  [/apple/,           '🍎'],
  [/carrot/,          '🥕'],
  [/potato/,          '🥔'],
  [/cheddar|cheese/,  '🧀'],
  [/lentil/,          '🫘'],
  [/bean/,            '🥫'],
  [/houmous|hummus/,  '🧆'],
  [/spinach/,         '🥬'],
  [/blueberr/,        '🫐'],
  [/peanut/,          '🥜'],
];
const iconFor = name => {
  const hit = ICONS.find(([re]) => re.test(name.toLowerCase()));
  return hit ? hit[1] : '🛒';
};

const money = n => '£' + n.toFixed(2);
// Matches the [data-store="..."] brand-colour rules in the stylesheet.
const slug = s => s.toLowerCase().replace(/[^a-z]/g, '');

const pctOf = (now, was) => (now - was) / was * 100;
// A true minus sign, not a hyphen -- these sit next to tabular figures.
const pctText = v => (v > 0 ? '+' : '\u2212') + Math.abs(v).toFixed(1) + '%';

// Last week's price for every cell that had one, plus the movement of the
// item's cheapest price -- which is the number the digest is built from.
// Items matched by name, so a renamed row simply starts fresh.
function attachMovement(current, previous) {
  const was = new Map(previous.map(it => [it.name, it]));
  for (const it of current) {
    const before = was.get(it.name);
    if (!before) continue;
    it.isNew = false;
    for (const p of it.prices) {
      const then = before.byStore[p.store];
      if (then) { p.was = then; p.pct = pctOf(p.price, then); }
    }
    if (before.best !== null && it.best !== null) {
      it.wasBest = before.best;
      it.wasBestStore = before.winners.map(w => w.store).join('/');
      it.bestPct = pctOf(it.best, before.best);
    }
  }
  for (const it of current) it.isNew = !was.has(it.name);
}

// The small figure that rides beside a price. Nothing is drawn for a move
// that rounds to zero -- a column of "0.0%" would bury the ones that matter.
function deltaEl(p) {
  if (!Number.isFinite(p.pct) || Math.abs(p.pct) < 0.05) return null;
  const el = document.createElement('span');
  el.className = 'delta ' + (p.pct > 0 ? 'up' : 'down');
  el.textContent = (p.pct > 0 ? '\u25b2' : '\u25bc') + pctText(p.pct).replace(/^[+\u2212]/, '');
  el.title = 'Was ' + money(p.was) + ' last week';
  return el;
}

// Anything smaller than this is shelf noise, not news.
const NOTABLE = 3;
const MAX_MOVERS = 8;

function buildDigest() {
  const tracked = items.filter(it => Number.isFinite(it.bestPct));
  if (!tracked.length) return;   // nothing to compare against yet

  const movers = tracked
    .filter(it => Math.abs(it.bestPct) >= NOTABLE)
    .sort((a, b) => Math.abs(b.bestPct) - Math.abs(a.bestPct))
    .slice(0, MAX_MOVERS);

  const h = document.createElement('h2');
  h.textContent = 'What moved this week 📊';

  // The whole list bought at its cheapest, then and now. One number for
  // whether the shop as a whole got dearer.
  const now = tracked.reduce((t, it) => t + it.best, 0);
  const then = tracked.reduce((t, it) => t + it.wasBest, 0);
  const basketPct = pctOf(now, then);

  const basket = document.createElement('p');
  basket.className = 'basket';
  const total = document.createElement('span');
  total.className = 'total';
  total.textContent = money(now);
  basket.append('One of each at its cheapest: ', total, ' ');
  if (Math.abs(basketPct) >= 0.05) {
    const d = document.createElement('span');
    d.className = 'delta ' + (basketPct > 0 ? 'up' : 'down');
    d.textContent = pctText(basketPct) + ' on last week';
    basket.append(d);
  } else {
    basket.append('— level with last week');
  }

  const down = tracked.filter(it => it.bestPct <= -NOTABLE).length;
  const up = tracked.filter(it => it.bestPct >= NOTABLE).length;
  const tally = document.createElement('span');
  tally.className = 'tally';
  tally.textContent = `📉 ${down} cheaper · 📈 ${up} dearer · ${tracked.length - down - up} steady`;
  basket.append(tally);

  digestEl.replaceChildren(h, basket);

  if (movers.length) {
    const list = document.createElement('div');
    list.className = 'movers';
    for (const it of movers) {
      const row = document.createElement('div');
      row.className = 'mover ' + (it.bestPct > 0 ? 'up' : 'down');

      const ico = document.createElement('span');
      ico.className = 'mv-ico';
      ico.setAttribute('aria-hidden', 'true');
      ico.textContent = iconFor(it.name);

      const text = document.createElement('span');
      text.className = 'mv-text';
      const name = document.createElement('b');
      name.className = 'mv-name';
      name.textContent = it.name;
      const sub = document.createElement('small');
      sub.className = 'mv-sub';
      const store = it.winners.map(w => w.store).join('/');
      // Where the cheapest moved shop, say so -- that is the actionable half.
      sub.textContent = store === it.wasBestStore
        ? `${store} ${money(it.best)} · was ${money(it.wasBest)}`
        : `now ${store} ${money(it.best)} · was ${it.wasBestStore} ${money(it.wasBest)}`;
      text.append(name, sub);

      const pct = document.createElement('span');
      pct.className = 'mv-pct';
      pct.textContent = (it.bestPct > 0 ? '📈 ' : '📉 ') + pctText(it.bestPct);

      row.append(ico, text, pct);
      list.append(row);
    }
    digestEl.append(list);
  } else {
    const calm = document.createElement('p');
    calm.className = 'quiet';
    calm.textContent = `😌 Nothing moved more than ${NOTABLE}% — a quiet week.`;
    digestEl.append(calm);
  }

  const fresh = items.filter(it => it.isNew);
  if (fresh.length) {
    const p = document.createElement('p');
    p.className = 'fresh';
    p.textContent = '🆕 Now tracking ' + fresh.map(it => it.name).join(', ') + '.';
    digestEl.append(p);
  }

  digestEl.hidden = false;
}

function render() {
  const term = q.value.trim().toLowerCase();
  const shown = items.filter(it => {
    if (store && !it.winners.some(w => w.store === store)) return false;
    if (!term) return true;
    return it.name.toLowerCase().includes(term)
        || it.prices.some(p => p.store.toLowerCase().includes(term));
  });

  grid.replaceChildren(...shown.map(it => {
    const card = document.createElement('article');
    card.className = 'card';

    const ico = iconFor(it.name);
    card.style.setProperty('--ico', JSON.stringify(ico));

    const head = document.createElement('div');
    head.className = 'head';
    const badge = document.createElement('span');
    badge.className = 'ico';
    badge.setAttribute('aria-hidden', 'true');
    badge.textContent = ico;
    const h = document.createElement('h2');
    h.className = 'item';
    h.textContent = it.name;
    head.append(badge, h);
    card.append(head);

    const wins = document.createElement('div');
    wins.className = 'winners';
    for (const w of it.winners) {
      const el = document.createElement('div');
      el.className = 'win';
      const s = document.createElement('span');
      s.className = 'store';
      s.dataset.store = slug(w.store);
      s.textContent = w.store;
      const p = document.createElement('span');
      p.className = 'price';
      p.textContent = money(w.price);
      if (it.unit) {
        const u = document.createElement('span');
        u.className = 'unit';
        u.textContent = '/' + it.unit;
        p.append(' ', u);
      }
      const fig = document.createElement('span');
      fig.className = 'win-fig';
      fig.append(p);
      const d = deltaEl(w);
      if (d) fig.append(d);

      el.append(s, fig);
      wins.append(el);
    }
    card.append(wins);

    if (it.others.length) {
      const rest = document.createElement('div');
      rest.className = 'rest';
      for (const o of it.others) {
        const row = document.createElement('div');
        const s = document.createElement('span');
        s.className = 'store';
        s.dataset.store = slug(o.store);
        s.textContent = o.store;
        const p = document.createElement('span');
        p.className = 'price';
        p.textContent = money(o.price);
        const fig = document.createElement('span');
        fig.className = 'rest-fig';
        fig.append(p);
        const d = deltaEl(o);
        if (d) fig.append(d);

        row.append(s, fig);
        rest.append(row);
      }
      card.append(rest);
    } else {
      const only = document.createElement('p');
      only.className = 'only';
      only.textContent = 'Only stocked here.';
      card.append(only);
    }

    return card;
  }));

  emptyEl.hidden = shown.length > 0;
  clearBtn.classList.toggle('on', q.value !== '');
}

function buildChips() {
  const wins = new Map();
  for (const it of items) {
    for (const w of it.winners) wins.set(w.store, (wins.get(w.store) || 0) + 1);
  }
  const ranked = [...wins.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));

  const mk = (label, value, count) => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.type = 'button';
    if (value) b.dataset.store = slug(value);
    b.textContent = label;
    if (count !== undefined) {
      const n = document.createElement('span');
      n.className = 'n';
      n.textContent = count;
      b.append(n);
    }
    b.setAttribute('aria-pressed', String(store === value));
    b.addEventListener('click', () => {
      store = (store === value) ? null : value;
      buildChips();
      render();
    });
    return b;
  };

  chipsEl.replaceChildren(
    mk('All items', null),
    ...ranked.map(([s, c]) => mk(s, s, c))
  );
}

q.addEventListener('input', render);
clearBtn.addEventListener('click', () => { q.value = ''; q.focus(); render(); });

const load = name => fetch(name, { cache: 'no-cache' }).then(r => {
  if (!r.ok) throw new Error('HTTP ' + r.status + ' fetching ' + name);
  return r.text();
});

// The previous week's file is written by update_prices.py before it rewrites
// this week's, so the two are always a week apart.
Promise.all([load('food_price_comparison.csv'), load('food_price_comparison_prev.csv')])
  .then(([text, prevText]) => {
    items = parseCsv(text);
    attachMovement(items, parseCsv(prevText));
    buildDigest();
    buildChips();
    render();
  })
  .catch(err => {
    const box = document.createElement('div');
    box.className = 'error';
    box.append(Object.assign(document.createElement('strong'), { textContent: "Couldn't load the price data." }));
    box.append(document.createElement('br'));
    box.append(Object.assign(document.createElement('code'), { textContent: String(err) }));
    grid.replaceWith(box);
  });
</script>
